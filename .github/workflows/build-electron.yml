name: Build IDA OS desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-electron.yml'

jobs:
  desktop-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: IDA-OS-Windows-Installer
            files: release/*.exe
          - os: macos-latest
            artifact: IDA-OS-macOS-Installer
            files: release/*.dmg
          - os: ubuntu-latest
            artifact: IDA-OS-Linux-AppImage
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
